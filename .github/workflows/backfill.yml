name: Backfill history

on:
  workflow_dispatch:
    inputs:
      since:
        description: "First date to load (YYYY-MM-DD)"
        default: "2016-01-01"

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/hsidata.py backfill --since "${{ inputs.since }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hsi.json
          git diff --cached --quiet || git commit -m "Data: backfill from ${{ inputs.since }}"
          git push
