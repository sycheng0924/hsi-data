name: Daily update

on:
  schedule:
    # HKEX posts the Daily Quotations sheet some time in the evening (HKT = UTC+8).
    # Hourly 17:05-00:05 HKT on weekdays, plus a catch-up run the next morning.
    - cron: "5 9-16 * * 1-5"
    - cron: "30 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python scripts/hsidata.py update
      - name: Commit if changed
        run: |
          if git diff --quiet docs/hsi.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: $(date -u +%Y-%m-%d)" docs/hsi.json
          git push
